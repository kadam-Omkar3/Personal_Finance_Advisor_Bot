# render.yaml — One-click deploy to Render.com
# Deploy at: https://dashboard.render.com/select-repo

services:
  # ── Backend (FastAPI) ────────────────────────────────────────
  - type: web
    name: finbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health
    plan: free

  # ── Frontend (Static Site) ───────────────────────────────────
  - type: web
    name: finbot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: finbot-backend
          type: web
          property: host
          transform: "https://{value}"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
